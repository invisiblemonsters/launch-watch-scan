name: Paid instant scan
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "*/15 * * * *"   # re-check unconfirmed payments, retry scan errors, pick up any missed events
  workflow_dispatch:
permissions:
  contents: write   # commit ledger/used-txids.json
  issues: write     # comment, label, close
concurrency:
  group: paid-scan-ledger   # one run at a time so the used-txids ledger never races
  cancel-in-progress: false
jobs:
  scan:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'paid-scan')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependency
        run: python -m pip install --quiet "pycryptodome>=3.20,<4"
      - name: Git identity for ledger commits
        run: |
          git config user.name "launch-watch-scan[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Process paid scan requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot/paid_scan.py
